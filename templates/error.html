{% extends "base.html" %}

{% block title %}Ошибка {{ code }}{% endblock %}

{% block content %}
<section class="section error-page">
  <div class="container">
    <div class="error-box">
      <div class="error-code">{{ code }}</div>
      <h1>{{ message }}</h1>
      <p>Нейрон тут бессилен — это уже моя ошибка в коде или в адресе.</p>
      <a class="btn btn-primary" href="/">На главную</a>
    </div>
  </div>
</section>
{% endblock %}
